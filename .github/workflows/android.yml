- name: Locate Flutter project
        run: |
          APP_DIR=$(dirname "$(find "$GITHUB_WORKSPACE" -name pubspec.yaml | head -n 1)")
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Download fonts
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p assets/fonts assets/icons
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Medium.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-SemiBold.ttf
          cp assets/fonts/Cairo-Regular.ttf assets/fonts/Cairo-Bold.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Regular.ttf" -o assets/fonts/Poppins-Regular.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf" -o assets/fonts/Poppins-Medium.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-SemiBold.ttf" -o assets/fonts/Poppins-SemiBold.ttf
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf" -o assets/fonts/Poppins-Bold.ttf
          printf '\x89PNG\r\n\x1a\n' > assets/icons/icon_dark.png
          cp assets/icons/icon_dark.png assets/icons/icon_light.png

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: to-best-debug-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
