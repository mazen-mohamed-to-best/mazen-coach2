# .github/workflows/android.yml
name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Locate project root
        shell: bash
        run: |
          set -e
          APP_DIR="$(dirname "$(find "$GITHUB_WORKSPACE" -name pubspec.yaml -print -quit)")"
          if [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project root: $APP_DIR"

      - name: Flutter pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: to-best-debug-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
